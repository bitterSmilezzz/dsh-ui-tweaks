# dsh-ui-tweaks — 界面增强 + 桌面通知 + 基础输入（合并后的单一 bundle）
#
# 2026-08-19 并入原 dsh-essentials 的剩余能力（架构级合并后）：
# - model-selector / paste-input（基础输入能力，lib/ 子模块）
# 原 essentials 的路由预设（Router Standard/Spec）与梁神模式已删除。
# at-file（@文件引用）已于 2026-08-20 移除：官方 rc.8 @ 菜单支持文件/会话引用，功能重复。
# auto-hide（输入框自动隐藏）与 immersive（沉浸模式）已于 2026-08-20 移除（精简）。
# 省 token（官方行调优 + ToolResultPruner 组合）已于 2026-08-21 移除：本就是官方能力预设，预设改由 profile 的 cordis.patch.yml 直接配置。
# 架构：host 半区 = lib/index.js 组合器（挂载领域模块 + retry 路由，
# 配置逐模块透传 pasteInput）；client 半区 = lib/client.js
# 单一自包含 bundle（3 个 client factory 内联，独立 client.js 子文件已删，唯一事实来源）。
#
# 既有功能：
# - plugin-inventory：插件列表增强（分类 tab）
# - retry-settings：请求重试次数设置（注册 /api/retry-settings 路由）
# - keyboard-shortcuts：全局快捷键
# - notify：桌面通知（审批/提问/轮次/会话完成）
#
# 设置入口统一放在「通用设置」下的「界面增强」总入口（settings.general.item）。
# 全部开关/选项读写统一 localStorage 配置对象（dsh-ui-tweaks.settings）。
#
# host inject 为各子模块并集（fs/webServer/loader/sessions/settings），
# 保证 apply 时硬依赖全部就绪。注意：inject 项是 Cordis 服务名（非 entry id）。
#
# Install:   dsh plugin --profile <profile> add <path-or-github>

# 禁用官方「插件列表」UI（id: ui-settings-plugin-inventory），
# 由本包注册的增强版替换（分类 tab）。
- id: ui-settings-plugin-inventory
  disabled: true

- insert:
    - id: dsh-ui-tweaks
      name: dsh-ui-tweaks
      inject:
        - fs
        - webServer
        - loader
        - sessions
        - settings

